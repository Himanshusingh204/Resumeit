name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest   # the tool targets Windows (PDF via Edge, folder buttons)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q   # no network, no AI; one test makes a real PDF with the runner's Edge
